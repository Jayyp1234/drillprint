[project]
name = "drillprint"
version = "0.1.0"
description = "Deterministic spectral fingerprinting for real-time drilling dysfunction recognition"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
drillprint = "cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
